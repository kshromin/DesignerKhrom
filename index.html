<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DesignerKhrom — конфигуратор корпусной мебели</title>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="viewport"></div>

<aside id="panel">
  <div id="price">
    <span class="sum">—</span>
    <span class="breakdown"></span>
  </div>

  <h1>Застройка</h1>
  <p class="hint">Объём, в котором строим. Миллиметры.</p>

  <div class="field">
    <label for="encWidth">Ширина</label>
    <input type="number" id="encWidth" step="10">
  </div>
  <div class="field">
    <label for="encHeight">Высота</label>
    <input type="number" id="encHeight" step="10">
  </div>
  <div class="field">
    <label for="encDepth">Глубина</label>
    <input type="number" id="encDepth" step="10">
  </div>

  <h2>Материал проекта</h2>
  <p class="hint">Действует на все детали, у которых не задан свой.</p>
  <select id="projectMaterial"></select>

  <h2>Палитра</h2>
  <div id="palette"></div>
  <p class="hint" id="placeHint"></p>

  <h2>Изделие</h2>
  <p class="hint">Просветы и детали с отступами по вложенности. Число — чистый просвет, мм.</p>
  <p id="notice" class="notice" hidden></p>
  <div id="chain"></div>
  <button type="button" id="reset" class="wide">Начать заново</button>
</aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
